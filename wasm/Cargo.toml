[package]
name = "unicode-art-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "WASM compute core for the unicode art generator: font parsing, image preparation, glyph packing and row layout solving"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# All tests live in tests/; skip the empty unit and doc test harnesses.
test = false
doctest = false

[dependencies]
ttf-parser = "0.25.1"
unicode-bidi = "0.3.18"
unicode-general-category = "1.1.0"
unicode-segmentation = "1.13.3"
wasm-bindgen = "0.2.130"
wuff = "0.2.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
